# A tag vX.Y.Z is a release: one macOS arm64 wheel of hands, carrying fritter, and the versions it was tested on, attached
# to the GitHub release vX.Y.Z.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs reads the version from the tag, so the history and its tags come too.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: fritter/go.mod
          cache-dependency-path: fritter/go.sum
      - uses: astral-sh/setup-uv@v6
      # [LAW:parse-dont-validate] the trigger's glob admits tags like v1.2.3-rc.1, whose PEP 440 version is not the tag's
      # text; a release tag is vX.Y.Z exactly, so the version hatch-vcs writes is the tag without its v.
      - name: The tag is vX.Y.Z
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eqx 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' || { echo "release: $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
      - name: Build the wheel
        run: uv build --wheel
      # [LAW:one-source-of-truth] `uv tool install` of a wheel ignores uv.lock and takes today's versions within
      # pyproject's ranges; the stranger installs with uv.lock's, the ones the tests ran on, as constraints.
      - name: Export the locked versions
        run: uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements.txt -o dist/constraints.txt
      # A stranger's one prerequisite: PyAudio ships wheels only for Windows, so on a Mac it builds against Homebrew's PortAudio.
      - name: Give the stranger PortAudio
        run: brew install portaudio
      # [LAW:one-source-of-truth] the wheel's name, platform tag included, is hatch_build.py's; dist holds the one wheel.
      - name: Install it as a stranger would, and run it
        run: scripts/verify-wheel.sh dist/*.whl dist/constraints.txt "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/constraints.txt --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
