[project]
name = "hands"
version = "0.0.1"
description = "Hands-free control of Claude Code: a voice intermediary in one daemon"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[anthropic,local,mlx-whisper,whisper,pocket-tts]>=1.9.0,<2",
    "loguru>=0.7",
]

[project.scripts]
hands-spike = "hands.spike:main"

[dependency-groups]
dev = ["pyright>=1.1", "pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMatchNotExhaustive = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
