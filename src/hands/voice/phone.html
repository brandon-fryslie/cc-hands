<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>hands</title>
<style>
  :root {
    --bg: #f4f2ee; --fg: #1d1c1a; --muted: #6b6862; --ring: #d9d5cd;
    --idle: #2f2d2a; --live: #c2410c; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141312; --fg: #eeebe6; --muted: #9a958d; --ring: #2c2a27; --idle: #e9e5de; --live: #f97316; --bad: #f87171; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #talk {
    width: min(68vw, 300px); aspect-ratio: 1; border-radius: 50%;
    border: 10px solid var(--ring); background: var(--idle); color: var(--bg);
    font: 600 22px/1.2 inherit; letter-spacing: .02em;
    touch-action: none; cursor: pointer; transition: transform .08s, background .08s;
  }
  #talk:disabled { opacity: .35; cursor: default; }
  #talk.held { background: var(--live); transform: scale(.96); }
  #told { color: var(--muted); text-align: center; max-width: 30ch; }
  #told p { margin: 0; min-height: 1.4em; }
  #state.bad { color: var(--bad); }
  #count { font-variant-numeric: tabular-nums; }
  #shown { font: inherit; color: var(--muted); background: none; border: 1px solid var(--ring); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  #conversation { color: var(--muted); }
  #transcript {
    width: min(100%, 36rem); max-height: 38vh; overflow-y: auto; margin: 0; padding: 0 4px;
    user-select: text; -webkit-user-select: text;
  }
  #transcript p { margin: 0 0 10px; }
  #transcript:empty::before { content: "Nothing said yet."; color: var(--muted); }
  #transcript .user { color: var(--muted); text-align: right; }
  /* hands' words not yet reached are faint; the one being said is marked; those cut off are struck through. */
  #transcript .ahead { opacity: .45; }
  #transcript .now { background: var(--ring); border-radius: 3px; }
  #transcript .cut { opacity: .45; text-decoration: line-through; }
</style>
</head>
<body>
<button id="talk" type="button">Connect</button>
<!-- The count changes ten times a second, so it sits outside the live region: a screen reader says each line once. -->
<div id="told">
  <p id="state" role="status" aria-live="polite"></p>
  <p id="count" aria-hidden="true"></p>
</div>
<button id="shown" type="button" aria-controls="transcript" aria-expanded="false">Show transcript</button>
<!-- The whole conversation, tools and all, with a box to type in: the address carries the key on as this one does. A
     page of its own, so a call on this one goes on while it is read. -->
<a id="conversation" href="/conversation" target="_blank" rel="noopener">Conversation</a>
<!-- Every line is written here whether it is shown or not: showing it is only taking the hidden off. -->
<section id="transcript" aria-label="Transcript" hidden></section>
<audio id="out" autoplay playsinline></audio>
<script>
"use strict";
// The phone's key travels in the fragment, which the browser never sends with the page's own request.
const key = decodeURIComponent(location.hash.slice(1));
// This page's own name, made as it opened: a call it makes again after a drop is one hands knows for this page's.
const PAGE = crypto.randomUUID();
// hands sends its voice every 20 ms, silence and all, for as long as the call is up: a call it has sent nothing over
// for this long is gone, as hands takes a page gone that sends nothing for its QUIET_SECS.
const QUIET_MS = 3000;
// The waits between calls made again, doubling from the first to the last, which repeats while hands stays out of reach.
const FIRST_RETRY_MS = 1000, LAST_RETRY_MS = 8000;
// hands answers an offer within a second or two: one unanswered for this long went to an address the phone can no longer
// reach, as when it moves off the LAN, and is a call dropped like any other.
const OFFER_MS = 10000;
const talk = document.getElementById("talk");
const state = document.getElementById("state");
const count = document.getElementById("count");
const out = document.getElementById("out");
const shown = document.getElementById("shown");
const transcript = document.getElementById("transcript");
document.getElementById("conversation").href = `/conversation${location.hash}`;

// Every render quantum of the microphone goes to the page as it is captured; whatever is sent in comes back out after
// every block captured before it, which is how a release is sent only once the words said before it have been.
const TAP = `
registerProcessor("tap", class extends AudioWorkletProcessor {
  constructor() { super(); this.port.onmessage = ({data}) => this.port.postMessage(data); }
  process(inputs) { const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
});`;

// The microphone, opened at the first Connect pressed and kept across every call made again after it, which no press
// starts: a browser opens the microphone for a press, not for a page calling on its own.
let media = null;  // {stream, audio, tap}
let call = null;  // {pc, channel, ended, press, release}
let held = false;
// Whether the page means to be on a call: from its first call's opening after Connect is pressed until hands gives the
// phone to another page, the page cannot call at all, or it goes. While it does, a call that drops is made again; a
// press whose call never opens is said, for the user there to press again.
let wanted = false;
let retry = null, tries = 0;
// Each call's own number for what it sends through the tap to come back, so what a dropped call sent is never taken
// for the next call's.
let tags = 0;

function say(text, bad = false) { state.textContent = text; state.classList.toggle("bad", bad); }

// What the page says of the hold it shows, by the last mark of it. Two marks are the page's own: `held`, the button
// down, and `sent`, the button let go with hands yet to say it took the hold. A mark that `counts` is waited on: the
// time since the button was let go counts beside its line.
const OWN = {
  "held": {text: () => "Listening…"},
  "sent": {text: () => "Sent. Waiting for hands…", counts: true},
};
// The marks hands tells (hands.voice.mark), each naming the marks it may come after. Nothing a mark carries says which
// hold it is of, so what places it is where it falls: a mark that cannot come after the shown hold's last is of a hold
// the page has let go of, and until hands says it took this hold or threw it away, nothing else told is of it.
const TOLD = {
  "released": {after: ["sent"], text: () => "Received. Transcribing…", counts: true},
  "discarded": {after: ["held", "sent"], text: () => "Not sent: hands threw that hold away.", bad: true},
  "transcript": {after: ["released"], text: () => "Heard. Waiting for a reply…", counts: true},
  "no words": {after: ["released"], text: (hold) => `No words heard, after ${secs(hold.at - hold.released)}.`, bad: true},
  "failed": {after: ["released", "transcript", "first LLM token"], text: (hold) => `hands failed, after ${secs(hold.at - hold.released)}.`, bad: true},
  "first LLM token": {after: ["released", "transcript"], text: () => "Replying…", counts: true},
  // The first sound after the button was let go, whatever hands said with it.
  "first audio": {after: ["released", "transcript", "first LLM token"], text: (hold) => `hands spoke after ${secs(hold.at - hold.released)}${hold.heard === null ? "" : `, your words heard at ${secs(hold.heard - hold.released)}`}.`},
};
// The hold shown: its last mark and when that came, when its button was let go, and when its words were heard.
let hold = null;
// The one timer the count runs on, while the hold shown is waited on.
let ticking = null;

function secs(ms) { return `${(ms / 1000).toFixed(1)} s`; }

function tick() { count.textContent = secs(performance.now() - hold.released); }

// Shows `next` as the hold: its line said once, and its count running while it is waited on.
function show(next) {
  letGo();
  hold = next;
  const line = OWN[hold.mark] ?? TOLD[hold.mark];
  say(line.text(hold), line.bad);
  if (line.counts) { ticking = setInterval(tick, 100); tick(); }
}

// Every time is the page's own, from the button let go to the mark arriving: the wait as it is felt at the phone.
function mark(name) {
  // [LAW:no-silent-failure] the page and hands disagree about what hands tells: said on its face, not guessed at.
  if (!Object.hasOwn(TOLD, name)) { letGo(); say(`hands said "${name}", which this page does not know.`, true); return; }
  if (hold === null || !TOLD[name].after.includes(hold.mark)) return;
  const at = performance.now();
  show({...hold, mark: name, at, heard: name === "transcript" ? at : hold.heard});
}

// Lets go of the hold shown: no mark told from here is of it, and its count stops.
function letGo() { clearInterval(ticking); ticking = null; hold = null; count.textContent = ""; }

// The sentence of hands' playing: its words, where each ends in its text, when it started, and the rate hands speaks
// at, in characters a millisecond; null between sentences.
let saying = null;  // {words, ends, started, rate, frame}

// Writes a line at the transcript's end, keeping its end in view if it was.
function write(line) {
  const atEnd = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 24;
  transcript.append(line);
  if (atEnd) transcript.scrollTop = transcript.scrollHeight;
}

// [LAW:one-source-of-truth] pocket-tts gives no word timings, so a word is reached when as many characters of its
// sentence have been said, at the rate hands measured, as come before it; the last waits there until hands says it is
// done.
function sweep() {
  const reached = (performance.now() - saying.started) * saying.rate;
  const now = Math.min(saying.ends.filter((end) => end <= reached).length, saying.words.length - 1);
  saying.words.forEach((word, i) => { word.className = i < now ? "" : i === now ? "now" : "ahead"; });
  saying.frame = requestAnimationFrame(sweep);
}

// Ends the sentence playing, each word as `left` would have it: said, or cut off.
function stop(left) {
  if (saying === null) return;
  cancelAnimationFrame(saying.frame);
  saying.words.forEach((word) => { word.className = left(word); });
  saying = null;
}

// What of a sentence stopped short was not heard: the words not yet reached.
const cutOff = (word) => word.className === "ahead" ? "cut" : "";

// What each line of the transcript does to the page (hands.voice.transcript).
const LINES = {
  "heard": ({text}) => {
    const line = document.createElement("p");
    line.className = "user";
    line.textContent = text;
    write(line);
  },
  "saying": ({text, chars_per_sec}) => {
    stop(() => "");
    const line = document.createElement("p");
    let end = 0;
    const words = [], ends = [];
    for (const part of text.split(/(\s+)/)) {
      if (part === "") continue;
      if (/^\s+$/.test(part)) { line.append(part); end += part.length; continue; }
      const word = document.createElement("span");
      word.textContent = part;
      line.append(word);
      words.push(word); end += part.length; ends.push(end);
    }
    write(line);
    saying = {words, ends, started: performance.now(), rate: chars_per_sec / 1000, frame: null};
    sweep();
  },
  "spoken": () => stop(() => ""),
  "cut": () => stop(cutOff),
};

// Everything hands tells the page, by its kind: a mark of the hold shown, or a line of the transcript.
function told(message) {
  if (message.kind === "mark") { mark(message.mark); return; }
  // [LAW:no-silent-failure] the page and hands disagree about what hands tells: said on its face, not guessed at.
  if (!Object.hasOwn(LINES, message.kind)) { say(`hands told a "${message.kind}", which this page does not know.`, true); return; }
  LINES[message.kind](message);
}

function pcm(blocks) {
  const length = blocks.reduce((n, b) => n + b.length, 0);
  const samples = new Int16Array(length);
  let i = 0;
  for (const block of blocks) for (const s of block) samples[i++] = Math.max(-32768, Math.min(32767, Math.round(s * 32767)));
  return samples.buffer;
}

async function open() {
  const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  const audio = new AudioContext();
  await audio.audioWorklet.addModule(URL.createObjectURL(new Blob([TAP], {type: "text/javascript"})));
  const tap = new AudioWorkletNode(audio, "tap");
  const mute = audio.createGain();
  mute.gain.value = 0;
  // Connected through to the output, silent, so the browser keeps pulling the microphone through the tap.
  audio.createMediaStreamSource(stream).connect(tap).connect(mute).connect(audio.destination);
  // A microphone taken away (unplugged, or by another app) sends nothing again: no call made over it would be heard.
  stream.getAudioTracks().forEach((track) => { track.onended = () => end("The microphone was taken away. Press Connect to open it again."); });
  return {stream, audio, tap};
}

async function connect(claim) {
  talk.disabled = true;
  if (!media) media = await open();
  const {audio, tap} = media;
  // A page brought back from the background may find its microphone asleep: a call over it would send nothing.
  await audio.resume();
  const pc = new RTCPeerConnection();
  pc.addTransceiver("audio", {direction: "recvonly"});
  pc.ontrack = (event) => { out.srcObject = new MediaStream([event.track]); out.play(); };
  const channel = pc.createDataChannel("talk", {ordered: true});
  channel.binaryType = "arraybuffer";
  // Twenty milliseconds of the microphone a message.
  const per = Math.round(audio.sampleRate / 50);
  let pending = [], count = 0, marked = null;
  const tag = ++tags;
  tap.port.onmessage = ({data}) => {
    if (typeof data === "number") { if (data === tag) { flush(); marked(); } return; }
    pending.push(data); count += data.length;
    if (count >= per) flush();
  };
  function flush() {
    if (count && channel.readyState === "open") channel.send(pcm(pending));
    pending = []; count = 0;
  }
  // Each press and release goes out after the one before it has: a press made while a release still waits on its mark
  // is sent after that release, so hands hears them in the order the button made them, and one mark is out at a time.
  let sent = Promise.resolve();
  const made = call = {pc, channel, ended: false,
    press() { sent = sent.then(() => channel.send("press")); },
    // The release waits for the mark to come back through the tap: everything said before it has been sent first.
    release() { sent = sent.then(() => new Promise((done) => { marked = () => { channel.send("release"); done(); }; tap.port.postMessage(tag); })); },
  };
  channel.onopen = () => {
    wanted = true; tries = 0;
    talk.disabled = false; talk.textContent = "Hold to talk"; say("Connected. Hold the button and speak.");
    watch(made);
  };
  channel.onmessage = ({data}) => told(JSON.parse(data));
  channel.onclose = () => dropped(made, "hands hung up.");
  pc.onconnectionstatechange = () => { if (pc.connectionState === "failed") dropped(made, "The connection to hands failed."); };

  // From here on, what fails is this call, settled against it: never another call made since, as this one ended.
  try {
    await pc.setLocalDescription(await pc.createOffer());
    // Every candidate is gathered before the offer goes: hands answers once, with all of its own.
    await new Promise((done) => {
      if (pc.iceGatheringState === "complete") return done();
      pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && done());
    });
    const answered = await fetch("offer", {
      method: "POST",
      headers: {"Authorization": `Bearer ${key}`, "Content-Type": "application/json"},
      body: JSON.stringify({sdp: pc.localDescription.sdp, type: "offer", rate: audio.sampleRate, page: PAGE, claim}),
      signal: AbortSignal.timeout(OFFER_MS),
    });
    const body = await answered.text();
    if (made.ended) return;
    // hands declines a call made again while another page has the phone: that page is the one in the user's hand.
    if (answered.status === 409) { end("Another page has hands' phone. Press Connect to take it here."); return; }
    // A server error may pass, as hands is restarted; a refusal of the page's key or its offer never does.
    if (answered.status >= 500) throw new Error(body);
    if (!answered.ok) { end(`Could not connect: ${body}`); return; }
    await pc.setRemoteDescription(JSON.parse(body));
  } catch (error) {
    dropped(made, `Could not reach hands: ${error.message}.`);
  }
}

// A call is gone once hands has sent nothing over it for QUIET_MS: a page woken from sleep finds its call still
// "connected", hands having hung it up while the phone could not hear it say so.
async function watch(made) {
  let received = null, heard = performance.now();
  while (!made.ended) {
    await new Promise((done) => setTimeout(done, 1000));
    if (made.ended) return;
    let now = 0, stats;
    // Closed while the wait ran: the call is over, and so is its watch.
    try { stats = await made.pc.getStats(); } catch { return; }
    stats.forEach((report) => { if (report.type === "inbound-rtp" && report.kind === "audio") now = report.packetsReceived; });
    if (now !== received) { received = now; heard = performance.now(); }
    else if (performance.now() - heard > QUIET_MS) dropped(made, "hands went quiet.");
  }
}

// What a call that ended leaves behind: the microphone, kept for the next, and nothing else.
function hangUp() {
  clearTimeout(retry); retry = null;
  if (call) { call.ended = true; call.channel.close(); call.pc.close(); call = null; }
  held = false;
  letGo();
  // The rest of what was playing never reaches this page.
  stop(cutOff);
  talk.classList.remove("held");
}

// The call `made` dropped: made again, after a wait that doubles with every try, while the page means to be on one.
function dropped(made, why) {
  if (made !== call || made.ended) return;
  if (!wanted) { end(`Could not connect: ${why}`); return; }
  hangUp();
  const wait = Math.min(FIRST_RETRY_MS * 2 ** tries, LAST_RETRY_MS);
  tries += 1;
  talk.disabled = true; talk.textContent = "Reconnecting";
  say(`${why} Calling again in ${Math.round(wait / 1000)} s…`, true);
  retry = setTimeout(() => { retry = null; place("resume"); }, wait);
}

// The page is done calling until Connect is pressed again: the microphone let go, and why said.
function end(why) {
  wanted = false; tries = 0;
  hangUp();
  if (media) { media.stream.getTracks().forEach((t) => t.stop()); media.audio.close(); media = null; }
  talk.disabled = false; talk.textContent = "Connect";
  say(why, true);
}

function place(claim) {
  say(claim === "take" ? "Connecting…" : "Calling hands again…");
  // What fails here failed before there was a call to make again: the microphone could not be opened or woken.
  connect(claim).catch((error) => end(`Could not connect: ${error.message}`));
}

function down(event) {
  event.preventDefault();
  if (!key) { say("Open this page from the address `hands phone` prints.", true); return; }
  if (!call && !retry) { place("take"); return; }
  if (!call || call.channel.readyState !== "open" || held) return;
  talk.setPointerCapture(event.pointerId);
  held = true;
  talk.classList.add("held");
  // A new hold takes the place of the one shown: what is shown from here is this hold's.
  show({mark: "held", at: null, released: null, heard: null});
  call.press();
}

function up() {
  if (!held) return;
  held = false;
  talk.classList.remove("held");
  // A hold hands threw away while the button was down stays said as that: nothing of it was sent to be waited on.
  if (hold?.mark === "held") show({...hold, mark: "sent", released: performance.now()});
  call.release();
}

// The transcript is hidden until asked for, and stays as this phone last left it.
function showTranscript(open) {
  transcript.hidden = !open;
  shown.setAttribute("aria-expanded", String(open));
  shown.textContent = open ? "Hide transcript" : "Show transcript";
  if (open) transcript.scrollTop = transcript.scrollHeight;
}
try { showTranscript(localStorage.getItem("transcript") === "shown"); } catch { showTranscript(false); }
shown.addEventListener("click", () => {
  showTranscript(transcript.hidden);
  try { localStorage.setItem("transcript", transcript.hidden ? "hidden" : "shown"); } catch { /* kept for this page only */ }
});

talk.addEventListener("pointerdown", down);
talk.addEventListener("pointerup", up);
talk.addEventListener("pointercancel", up);
talk.addEventListener("contextmenu", (event) => event.preventDefault());
// A page put away mid-hold lets go of the button; brought back, a call that dropped while it was away is made again at
// once rather than after the wait.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { up(); return; }
  if (retry) { clearTimeout(retry); retry = null; place("resume"); }
});
// One closed hangs up.
addEventListener("pagehide", () => end("This page hung up."));
</script>
</body>
</html>
